name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: retail

jobs:
  # ---------------------------------------------------------------------------
  # v1 path: one full extract, full refresh, build and test, export dashboard data
  # ---------------------------------------------------------------------------
  pipeline:
    name: Full refresh - generate, load, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (generator, daily slicer, loader SQL)
        run: pytest -q

      - name: Extract - generate source CSVs
        run: python pipeline/generate_data.py

      - name: Load - land CSVs in the raw schema
        run: python pipeline/load_raw.py

      - name: Check source freshness
        working-directory: warehouse
        run: dbt source freshness --profiles-dir .

      - name: Transform and test - dbt build
        working-directory: warehouse
        run: dbt build --profiles-dir .

      - name: Generate dbt docs
        working-directory: warehouse
        run: dbt docs generate --profiles-dir .

      - name: Print the monthly store performance mart
        run: |
          psql -c "select store_name, year_month, revenue, margin_pct
                   from marts.mart_monthly_store_performance
                   order by year_month desc, revenue desc
                   limit 10;"

      # Second path: the same two years delivered as 745 daily batches into another
      # database. Only this path has price history, so costs are point-in-time here.
      - name: Full history - generate every daily batch
        run: python pipeline/generate_data.py --backfill 2024-01-01 2026-01-14

      - name: Full history - load all batches and build
        env:
          PGDATABASE: retail_history
        run: |
          psql -d retail -c "create database retail_history;"
          python pipeline/load_raw.py --mode append --backfill 2024-01-01 2026-01-14 2>&1 | tail -3
          (cd warehouse && dbt build --profiles-dir .)

      - name: Both paths agree on revenue; history changes only cost
        run: |
          totals() {
            psql -d "$1" -At -c "select count(*) || ',' || sum(net_amount) filter (where is_revenue)
                                 from marts.fct_sales"
          }
          full="$(totals retail)"
          history="$(totals retail_history)"
          echo "full refresh  (lines, revenue): $full"
          echo "daily history (lines, revenue): $history"
          test "$full" = "$history"
          for db in retail retail_history; do
            psql -d "$db" -c "select '$db' as path,
                                     count(*) filter (where version_number > 0) as product_versions,
                                     count(distinct product_key) filter (where version_number > 0) as products
                              from marts.dim_product_history;"
          done
          psql -d retail -At -c "select 'full refresh margin:  ' || round(sum(gross_margin) / sum(net_amount) filter (where cost_amount is not null), 4) from marts.fct_sales where is_revenue"
          psql -d retail_history -At -c "select 'point-in-time margin: ' || round(sum(gross_margin) / sum(net_amount) filter (where cost_amount is not null), 4) from marts.fct_sales where is_revenue"

      - name: Export dashboard data from the full-history marts
        env:
          PGDATABASE: retail_history
        run: python dashboard/export_data.py

      - name: Show dashboard headline KPIs
        run: python -c "import json; print(json.dumps(json.load(open('dashboard/data/summary.json')), indent=2)[:1500])"

      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            warehouse/target/index.html
            warehouse/target/manifest.json
            warehouse/target/catalog.json

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: dashboard/

  # ---------------------------------------------------------------------------
  # v2 path: daily batches appended one day at a time, rebuilt after each day,
  # then one day re-loaded to prove the load is idempotent
  # ---------------------------------------------------------------------------
  daily-batches:
    name: Daily batches - append day by day, prove idempotency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WINDOW_START: "2025-06-28"
      WINDOW_END: "2025-07-03"
      REPLAY_DAY: "2025-07-01"
      # No lookback: each incremental run picks up only lines loaded since the last run,
      # so the full-refresh comparison below really tests the incremental logic.
      DBT_VARS: "{incremental_lookback_hours: 0}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract - one batch folder per day
        run: python pipeline/generate_data.py --backfill "$WINDOW_START" "$WINDOW_END"

      - name: Load and build, one day at a time
        run: |
          day="$WINDOW_START"
          while [ "$(date -d "$day" +%s)" -le "$(date -d "$WINDOW_END" +%s)" ]; do
            echo "::group::run date $day"
            python pipeline/load_raw.py --mode append --run-date "$day"
            (cd warehouse && dbt build --profiles-dir . --vars "$DBT_VARS")
            echo "::endgroup::"
            day="$(date -d "$day + 1 day" +%F)"
          done

      - name: Row counts per run date
        run: |
          psql -c "select _run_date, count(*) as order_rows
                   from raw.orders group by _run_date order by _run_date;"

      - name: Replay one day and prove nothing is duplicated
        run: |
          snapshot() {
            psql -At -c "select
              (select count(*) from raw.orders) || ',' ||
              (select count(*) from raw.order_items) || ',' ||
              (select count(*) from raw.customers) || ',' ||
              (select count(*) from raw.products) || ',' ||
              (select coalesce(sum(net_amount), 0) from marts.fct_sales where is_revenue)"
          }
          before="$(snapshot)"
          python pipeline/load_raw.py --mode append --run-date "$REPLAY_DAY"
          (cd warehouse && dbt build --profiles-dir . --vars "$DBT_VARS")
          after="$(snapshot)"
          echo "before replay: $before"
          echo "after replay:  $after"
          test "$before" = "$after"

      - name: Products show the 2025-07-01 price rise
        run: |
          psql -c "select _run_date, unit_price from raw.products
                   where product_id = (select min(product_id) from raw.products)
                   order by _run_date;"

      - name: The price rise became a second product version
        run: |
          psql -c "select product_version_key, version_number, unit_cost, unit_price,
                          valid_from, valid_to, is_current
                   from marts.dim_product_history
                   where product_id = (select min(product_id) from raw.products)
                   order by version_number;"
          versions="$(psql -At -c "select count(*) from marts.dim_product_history
                                   where product_id = (select min(product_id) from raw.products)")"
          test "$versions" = "2"

      - name: Incremental fct_sales equals a full rebuild
        run: |
          fact_totals() {
            psql -At -c "select count(*) || ',' || sum(net_amount) || ',' ||
                                coalesce(sum(cost_amount), 0) || ',' ||
                                count(*) filter (where order_status = 'completed')
                         from marts.fct_sales"
          }
          incremental="$(fact_totals)"
          (cd warehouse && dbt build --profiles-dir . --full-refresh --select fct_sales+)
          rebuilt="$(fact_totals)"
          echo "incremental:  $incremental"
          echo "full rebuild: $rebuilt"
          test "$incremental" = "$rebuilt"

  # ---------------------------------------------------------------------------
  # Airflow: the DAG parses, has the right shape, and its commands render
  # ---------------------------------------------------------------------------
  dag-integrity:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    env:
      DUKAAN_REQUIRE_AIRFLOW: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestration/requirements-airflow.txt

      - name: Install Airflow 2.10.5 with the official constraints
        run: pip install -r orchestration/requirements-airflow.txt

      - name: Initialise Airflow's metadata database (SQLite)
        run: |
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow" >> "$GITHUB_ENV"
          AIRFLOW_HOME="$RUNNER_TEMP/airflow" airflow db migrate

      - name: Test the DAG
        run: pytest orchestration/tests -q -rs
