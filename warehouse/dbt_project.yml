name: retail_dw
version: "1.0.0"
config-version: 2

profile: retail_dw

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages
  - logs

vars:
  # Sales period from docs/data-contract.md. dim_date and the period test read these.
  sales_start_date: "2024-01-01"
  sales_end_date: "2025-12-31"
  # Customer segmentation thresholds, counted on completed orders.
  returning_min_orders: 2
  loyal_min_orders: 10
  # fct_sales is incremental: lines loaded within this window of the last run are re-processed.
  incremental_lookback_hours: 72

models:
  retail_dw:
    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: "#8fb3d9"
    intermediate:
      +materialized: view
      +schema: intermediate
      +docs:
        node_color: "#b9a3d6"
    marts:
      +materialized: table
      +schema: marts
      +persist_docs:
        relation: true
        columns: true
      +docs:
        node_color: "#7fbf7f"

data_tests:
  retail_dw:
    +severity: error
